services:
  hvac-sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    networks:
      - bacnet-lab
    # BACnet/IP uses UDP broadcast, so the sim binds to its container interface
    # (see --address auto in the Dockerfile) rather than 0.0.0.0.
    ports:
      - "47808:47808/udp"

  web-hmi:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Its own container is its own BACnet stack, so it reads and writes the sim
    # over the wire instead of touching the server's in-process objects.
    entrypoint: ["python", "hmi.py", "--web", "--device-ip", "hvac-sim", "--web-port", "8090"]
    networks:
      - bacnet-lab
    ports:
      - "8090:8090"
    depends_on:
      - hvac-sim

  caldera:
    build:
      context: ..
      dockerfile: docker/Dockerfile.caldera
    networks:
      - bacnet-lab
    ports:
      - "8888:8888"
      - "8443:8443"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8888"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    networks:
      - bacnet-lab
    depends_on:
      caldera:
        condition: service_healthy
    environment:
      - CALDERA_SERVER=http://caldera:8888
      - AGENT_GROUP=red

networks:
  bacnet-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
